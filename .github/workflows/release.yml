name: Release Gestalt package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: gestalt-npm-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'gestaltrun/better-sidebar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PUBLISH_PACKAGE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Configure git identity for tests
        run: |
          git config --global user.name "gestalt-sidebar-ci"
          git config --global user.email "ci@dsh.invalid"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build and verify artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: pnpm run release:pack -- --out "$RUNNER_TEMP/gestalt-sidebar-package"
      - name: Build, verify, and publish artifact
        if: github.event_name == 'release' || inputs.publish
        run: pnpm run release:publish -- --out "$RUNNER_TEMP/gestalt-sidebar-package"
      - uses: actions/upload-artifact@v4
        with:
          name: gestalt-better-sidebar-package
          path: ${{ runner.temp }}/gestalt-sidebar-package/*.tgz
          if-no-files-found: error
